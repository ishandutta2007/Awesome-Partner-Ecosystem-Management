<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#071120"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Node Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="networkGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beamScan {
        0% { transform: translateX(-300px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateX(1100px); opacity: 0; }
      }
      .pulse-node { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .float-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-card-2 { animation: floatAlt 6s ease-in-out infinite; }
      .stream-line { stroke-dasharray: 6 6; animation: dashFlow 2.5s linear infinite; }
      .scan-beam { animation: beamScan 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect width="920" height="260" rx="14" fill="url(#networkGrid)"/>
  <rect width="920" height="260" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25"/>

  <!-- Scanning Light Line -->
  <g class="scan-beam">
    <line x1="0" y1="0" x2="100" y2="260" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" filter="url(#softGlow)"/>
  </g>

  <!-- Background Dynamic Network Nodes & Connectors -->
  <g opacity="0.45">
    <line x1="120" y1="50" x2="260" y2="80" stroke="#38bdf8" stroke-width="1.5" class="stream-line"/>
    <line x1="260" y1="80" x2="380" y2="40" stroke="#818cf8" stroke-width="1.5" class="stream-line"/>
    <line x1="680" y1="45" x2="800" y2="85" stroke="#c084fc" stroke-width="1.5" class="stream-line"/>
    <line x1="740" y1="210" x2="840" y2="160" stroke="#38bdf8" stroke-width="1.5" class="stream-line"/>
    <line x1="100" y1="200" x2="220" y2="220" stroke="#10b981" stroke-width="1.5" class="stream-line"/>

    <circle cx="120" cy="50" r="5" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <circle cx="260" cy="80" r="4" fill="#818cf8"/>
    <circle cx="380" cy="40" r="5" fill="#c084fc"/>
    <circle cx="680" cy="45" r="4" fill="#818cf8"/>
    <circle cx="800" cy="85" r="5.5" fill="#38bdf8" filter="url(#nodeGlow)"/>
    <circle cx="740" cy="210" r="4" fill="#c084fc"/>
    <circle cx="840" cy="160" r="4.5" fill="#10b981"/>
    <circle cx="100" cy="200" r="4.5" fill="#06b6d4"/>
    <circle cx="220" cy="220" r="4" fill="#10b981"/>
  </g>

  <!-- Dynamic Floating Decorative Ecosystem Badges (Sides & Accents) -->
  <g class="float-card-1" opacity="0.8">
    <g transform="translate(45, 80)">
      <rect width="115" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8" class="pulse-node"/>
      <text x="32" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Co-Selling</text>
    </g>
    <g transform="translate(760, 150)">
      <rect width="125" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#c084fc" class="pulse-node"/>
      <text x="32" y="20" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Partner Portal</text>
    </g>
  </g>

  <g class="float-card-2" opacity="0.8">
    <g transform="translate(60, 150)">
      <rect width="125" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#34d399" class="pulse-node"/>
      <text x="32" y="20" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Account Mapping</text>
    </g>
    <g transform="translate(755, 75)">
      <rect width="125" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#fbbf24" class="pulse-node"/>
      <text x="32" y="20" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PRM &amp; Deals</text>
    </g>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Tags) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(355, 32)">
      <rect width="210" height="26" rx="13" fill="#1e293b" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="15" cy="13" r="4" fill="#38bdf8"/>
      <text x="27" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM STACK</text>
    </g>

    <!-- Main Title -->
    <text x="460" y="105" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">
      AWESOME PARTNER ECOSYSTEM
    </text>
    <text x="460" y="105" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">
      AWESOME PARTNER ECOSYSTEM
    </text>

    <!-- Subtitle -->
    <text x="460" y="136" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
      Partner Relationship Management (PRM) • Account Mapping • Co-Selling • Marketplaces
    </text>

    <!-- Secondary Subtitle Line -->
    <text x="460" y="162" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400">
      Enterprise SaaS Platforms vs Self-Hosted Open-Source Alternatives &amp; Developer Tools
    </text>

    <!-- Feature Pills at Bottom -->
    <g transform="translate(230, 192)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="65" y="18" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🏢 SaaS Rankings</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
        <text x="72" y="18" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💻 Open-Source Alternatives</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(299, 0)">
        <rect width="160" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <text x="80" y="18" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Transparent Pricing &amp; Tiers</text>
      </g>
    </g>
  </g>
</svg>
